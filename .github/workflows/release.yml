name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-mac:
    name: Build macOS App
    runs-on: macos-15
    env:
      GITHUB_REPO_NAME: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 16.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Resolve Dependencies
        working-directory: mac
        run: |
          xcodebuild -resolvePackageDependencies -workspace VibeTunnel.xcworkspace

      - name: Build Release (arm64)
        working-directory: mac
        run: |
          ./scripts/build.sh --configuration Release --arch arm64
          mv build/Build/Products/Release/VibeTunnel.app build/Build/Products/Release/VibeTunnel-arm64.app

      - name: Build Release (x86_64)
        working-directory: mac
        run: |
          # Clean build directory for x86_64 build
          rm -rf build/Build/Products/Release/VibeTunnel.app
          ./scripts/build.sh --configuration Release --arch x86_64
          mv build/Build/Products/Release/VibeTunnel.app build/Build/Products/Release/VibeTunnel-x86_64.app

      - name: Create DMGs and ZIPs
        working-directory: mac
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix if present

          # Create arm64 DMG and ZIP
          ./scripts/create-dmg.sh "build/Build/Products/Release/VibeTunnel-arm64.app"
          ./scripts/create-zip.sh "build/Build/Products/Release/VibeTunnel-arm64.app"

          # Create Intel DMG and ZIP
          ./scripts/create-dmg.sh "build/Build/Products/Release/VibeTunnel-x86_64.app"
          ./scripts/create-zip.sh "build/Build/Products/Release/VibeTunnel-x86_64.app"

          # List created files
          echo "Created files:"
          ls -la build/*.dmg build/*.zip

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            mac/build/*.dmg
            mac/build/*.zip
          retention-days: 7

  build-ios:
    name: Build iOS App
    runs-on: macos-15
    env:
      GITHUB_REPO_NAME: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 16.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Resolve Dependencies
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies -project VibeTunnel.xcodeproj

      - name: Build iOS Release
        working-directory: ios
        run: |
          xcodebuild build \
            -project VibeTunnel.xcodeproj \
            -scheme VibeTunnel \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build/DerivedData

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: ios/build/DerivedData/Build/Products/Release-iphoneos/
          retention-days: 7

  build-node-backend-matrix:
    name: Build Node Backend (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: macos
            arch: x64
            runner: macos-13
          - platform: macos
            arch: arm64
            runner: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            ~/Library/Caches/zig
            web/.zig-cache
          key: ${{ runner.os }}-${{ matrix.arch }}-zig-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-zig-

      - name: Cache node-gyp artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/node-gyp
            ~/.node-gyp
            ~/Library/Caches/node-gyp
          key: ${{ runner.os }}-${{ matrix.arch }}-node-gyp-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-node-gyp-

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build native executable bundle
        working-directory: web
        run: pnpm run build:ci

      - name: Verify native output files
        shell: bash
        run: |
          ls -la web/native
          test -f web/native/vibetunnel
          test -f web/native/vibetunnel-fwd
          test -f web/native/pty.node
          test -f web/native/authenticate_pam.node
          if [ "${{ matrix.platform }}" = "macos" ]; then
            test -f web/native/spawn-helper
          fi

      - name: Package native archive
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          ARCHIVE_NAME="vibetunnel-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"

          FILES=(vibetunnel vibetunnel-fwd pty.node authenticate_pam.node)
          if [ "${{ matrix.platform }}" = "macos" ]; then
            FILES+=(spawn-helper)
          fi

          tar -czf "$ARCHIVE_NAME" -C web/native "${FILES[@]}"
          tar -tzf "$ARCHIVE_NAME"
          echo "NATIVE_ARCHIVE=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Upload node backend archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-backend-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.NATIVE_ARCHIVE }}
          retention-days: 7

  build-rust-backend-matrix:
    name: Build Rust Backend (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: macos
            arch: x64
            runner: macos-13
          - platform: macos
            arch: arm64
            runner: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            web/rust-server/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('web/rust-server/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev

      - name: Build Rust backend binary
        working-directory: web
        run: cargo build --release --manifest-path rust-server/Cargo.toml

      - name: Verify Rust backend output
        shell: bash
        run: |
          test -f web/rust-server/target/release/vibetunnel-rs
          test -x web/rust-server/target/release/vibetunnel-rs

      - name: Package Rust backend archive
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          ARCHIVE_NAME="vibetunnel-rs-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"

          tar -czf "$ARCHIVE_NAME" -C web/rust-server/target/release vibetunnel-rs
          tar -tzf "$ARCHIVE_NAME"
          echo "RUST_ARCHIVE=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Upload Rust backend archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-backend-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.RUST_ARCHIVE }}
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-mac
      - build-node-backend-matrix
      - build-rust-backend-matrix
    runs-on: ubuntu-latest

    steps:
      - name: Download mac release artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-release
          path: release-assets

      - name: Download node backend release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: node-backend-*
          path: release-assets/node
          merge-multiple: true

      - name: Download Rust backend release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rust-backend-*
          path: release-assets/rust
          merge-multiple: true

      - name: List release assets
        run: |
          ls -la release-assets
          ls -la release-assets/node
          ls -la release-assets/rust

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/node/vibetunnel-*.tar.gz
            release-assets/rust/vibetunnel-rs-*.tar.gz
          draft: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
